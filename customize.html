<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Your Drink - Brew Haven</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <img src="https://via.placeholder.com/40x40?text=☕" alt="Brew Haven Logo">
            <span>Brew Haven</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#main-feature">Main Feature</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Customization Section -->
    <section class="customize-section">
        <div class="customize-container">
            <div class="card-header">
                <a href="index.html#main-feature" class="btn-back">← Back to Menu</a>
            </div>
            <h2>Customize Your Drink</h2>
            <p id="itemTitle">Select your preferences</p>
            <form id="customizeForm">
                <div class="form-group">
                    <label for="size-select">Size:</label>
                    <select id="size-select" name="size" required>
                        <option value="Small">Small</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Large">Large</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="milk-select">Milk Type:</label>
                    <select id="milk-select" name="milk" required>
                        <option value="Whole Milk">Whole Milk</option>
                        <option value="Oat Milk">Oat Milk</option>
                        <option value="Almond Milk">Almond Milk</option>
                        <option value="Skim Milk">Skim Milk</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sugar-slider">Sugar Level:</label>
                    <input type="range" id="sugar-slider" name="sugar" min="0" max="4" value="2">
                    <span id="sugarValue">2</span>
                </div>
                <div class="form-group">
                    <label>Price:</label>
                    <span id="price-display">₱140.00</span>
                </div>
                <button type="button" id="add-to-cart-btn" onclick="addToCart()" class="btn-submit">Add to Cart</button>
            </form>
        </div>
    </section>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Item added to cart!</div>

    <!-- Floating Cart Icon -->
    <div id="floatingCart" class="floating-cart">
        <a href="cart.html" class="cart-link">
            <span class="cart-icon">🛒</span>
            <span id="cartCount" class="cart-badge">0</span>
        </a>
    </div>

    <script src="customize.js"></script>
</body>
</html>
